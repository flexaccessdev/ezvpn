[package]
name = "ezvpn"
version = "0.0.53"
edition = "2024"
description = "IP-over-QUIC VPN tunnel via iroh P2P"
readme = "README.md"
repository = "https://github.com/flexaccessdev/ezvpn"

[lib]
name = "ezvpn"
# rlib: consumed by the desktop bin (src/main.rs) and tests.
# staticlib: linked into Apple Network Extensions (iOS and native macOS).
# cdylib: `ezvpn.dll`, P/Invoked by the native Windows GUI (`ezvpn-windows`)
#   via the C FFI in `src/ffi_windows.rs`. Built by `build-windows.ps1`.
#   Also `libezvpn.so` for Android, loaded by the `ezvpn-android` app through
#   the JNI surface in `src/ffi_android.rs`. Built by `build-android.sh`.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dirs = "6"
env_logger = "0.11"
etherparse = "0.20"
# Shared FlexAccess auth key format (`ed25519-sec:` / `ed25519-pub:` tokens,
# key files, authorized-keys parsing). Key generation is the standalone
# `flexaccess-keys` CLI; this library only parses, signs, and verifies.
flexaccess-keys = { git = "https://github.com/flexaccessdev/flexaccess-keys", tag = "v0.0.2", default-features = false }
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
# Shared iroh transport layer (RelayConfig + per-relay probe, endpoint
# build/rebuild, home-relay watchdog, endpoint-bound auth transcript). No
# `mdns` feature: ezvpn runs no local-network discovery.
flexaccess-iroh = { git = "https://github.com/flexaccessdev/flexaccess-iroh", tag = "v0.0.9" }
# Redirected to the fork below via `[patch.crates-io]`, which also covers the
# shared crate's own `iroh` dependency so the graph holds a single `iroh`.
# `unstable-custom-transports` only makes the path-selector API public, for the
# client's `exclude_direct_paths` selector (src/transport/path_selector.rs).
iroh = { version = "1.2.0", features = ["unstable-custom-transports"] }
noq-proto = "1.3.0"
n0-watcher = "1.0.0"
log = "0.4"
libc = "0.2"
rand = "0.10"
# Custom-relay `/healthz` checks (see `transport::paths`). `rustls-no-provider`
# matches the exact reqwest feature iroh already enables, so this adds no new TLS
# backend (no openssl / aws-lc); the probe hands reqwest a ring + webpki-roots
# config so the platform verifier (unusable on Android) is never built.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Embedded Mozilla roots for the `/healthz` probe TLS config (same roots iroh
# verifies the relay connection with; see `transport::paths::healthz_tls_config`).
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1.3"
tun = { version = "0.8", features = ["async"] }
url = "2"

# Unix-only: backgrounding via fork/setsid. Not built on Windows (the crate is
# Unix-only, and `--daemon` is gated to Unix in the code). `daemonix` is a
# maintained drop-in fork of the unmaintained `daemonize` crate.
[target.'cfg(unix)'.dependencies]
daemonix = "0.1"

# Windows-only: resolve %ProgramData% via the Known Folders API
# (SHGetKnownFolderPath) so the runtime/log dirs follow the real install drive
# instead of assuming C:\ when the env var is missing.
[target.'cfg(windows)'.dependencies]
known-folders = "1"
# Route add/remove on the TUN interface goes through the IP Helper API
# (CreateIpForwardEntry2 / DeleteIpForwardEntry2) instead of shelling out to
# netsh — typed error codes instead of parsing localized netsh output, and no
# per-route process spawn. Same version the `tun` crate already pulls in.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# Desktop-only: on-link subnet enumeration for the connect-time split-tunnel
# overlap refusal (src/net/local_networks.rs). The mobile apps carry their own
# ports of this check (ezvpn-apple TunnelCore, ezvpn-android tunnelcore).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
if-addrs = "0.15"

# Android-only: the JNI bridge for the `ezvpn-android` VpnService, and logcat
# output for `log` (stderr is discarded on Android).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"
# iroh's Android DNS/interface discovery (hickory-resolver, netwatch) reaches
# the JVM through this global; the app registers its Context via `EzvpnNative.init`.
ndk-context = "0.1"

[dev-dependencies]
mock_instant = "0.6"
rand_chacha = "0.10"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# Forks of the transport stack, applied as patches rather than git
# dependencies so every crate in the graph (`flexaccess-iroh`, iroh itself)
# resolves to the same package (see flexaccess-iroh's README, "Consumers on a
# fork of iroh"). Cargo.lock pins each tested branch commit.
[patch.crates-io]
# Forked from iroh v1.2.0. Preserves established-path transport backpressure so
# noq retains and retries the transmit instead of treating a local discard as
# successful, and exposes noq's batch datagram send/receive on `Connection`
# (one connection-lock acquisition per burst instead of per packet).
iroh = { git = "https://github.com/flexaccessdev/iroh.git", branch = "ezvpn-batch-datagrams-1.2.0" }
# Forked from noq v1.3.0. Stamps each received batch as it is read rather than
# once per endpoint-driver poll, and makes BBRv3 skip a non-positive RTT
# sample: a stale receive timestamp read as a zero RTT, which the 10 s min-RTT
# filter held, zeroing the BDP and leaving the congestion window erratic on
# sub-millisecond paths. All three crates come from the fork so the graph holds
# a single `noq-udp`.
noq = { git = "https://github.com/flexaccessdev/noq.git", branch = "ezvpn-rtt-sample-fixes-1.3.0" }
noq-proto = { git = "https://github.com/flexaccessdev/noq.git", branch = "ezvpn-rtt-sample-fixes-1.3.0" }
noq-udp = { git = "https://github.com/flexaccessdev/noq.git", branch = "ezvpn-rtt-sample-fixes-1.3.0" }
# Forked from netwatch v0.19.3 (n0-computer/net-tools). Sizes iroh's UDP
# socket buffers with SO_RCVBUFFORCE/SO_SNDBUFFORCE when the process holds
# CAP_NET_ADMIN (the VPN runs as root), so Linux's default
# net.core.rmem_max/wmem_max (~208 KiB) no longer caps the 7 MiB request and
# overflows the receive queue under load. Unprivileged, the capped options
# apply as before.
netwatch = { git = "https://github.com/flexaccessdev/net-tools.git", branch = "ezvpn-bufforce-0.19.3" }
